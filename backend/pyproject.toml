[project]
name = "refinery-copilot-api"
version = "0.0.1"
description = "Thin HTTP stub for Refinery Copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "sse-starlette>=2.1",
    "refinery-core",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
