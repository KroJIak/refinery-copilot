services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /app/data
      ARTIFACTS_DIR: /app/artifacts
      SEED: ${SEED:-42}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
    env_file: .env
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
